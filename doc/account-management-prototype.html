<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SolarNotes 管理后台的账号管理原型。可展开账号菜单，体验修改演示密码的表单和反馈。">
    <title>修改密码 · SolarNotes 管理后台原型</title>
    <style>
        :root {
            color-scheme: light;
            font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --ink: #29364b;
            --muted: #647187;
            --line: #e1e6ef;
            --accent: #535fc7;
            --error: #b13238;
            color: var(--ink);
            background: #f7f8fb;
        }
        * { box-sizing: border-box; }
        body, h1, p { margin: 0; }
        button, input { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; }
        button:disabled { cursor: wait; opacity: .65; }
        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 3px solid #8791ec; outline-offset: 3px; }
        [hidden] { display: none !important; }
        .icons { position: absolute; width: 0; height: 0; overflow: hidden; }
        .icon { width: 20px; height: 20px; flex: none; }
        .shell { min-height: 100vh; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
        aside { background: #2d3a4b; color: #c8d1de; }
        .brand, .nav-item, .topbar, .crumbs, .account, .heading, .input-wrap, .buttons { display: flex; align-items: center; }
        .brand { height: 60px; gap: 11px; padding: 0 23px; color: white; font-size: 17px; font-weight: 650; white-space: nowrap; }
        .brand .icon { color: #b4b7ff; width: 24px; height: 24px; }
        aside nav { padding: 16px 12px; }
        .nav-item {
            width: 100%; gap: 13px; min-height: 46px; margin-bottom: 3px; padding: 0 15px;
            border: 0; border-radius: 7px; text-align: start; background: transparent; color: inherit;
        }
        .nav-item:hover { background: #39485b; color: white; }
        .nav-item .chevron { margin-left: auto; width: 14px; height: 14px; }
        .nav-item[aria-expanded="true"] .chevron { transform: rotate(180deg); }
        #account-toggle { color: white; }
        .subnav { margin: 3px 0 0 24px; padding-left: 11px; border-left: 1px solid #526073; }
        .nav-item[aria-current="page"] { min-height: 38px; color: white; background: #5966c8; font-weight: 600; }
        .subnav .icon { width: 16px; height: 16px; }
        .workspace { min-width: 0; }
        .topbar { min-height: 60px; padding: 0 clamp(14px, 2.5vw, 36px); gap: 20px; justify-content: space-between; border-bottom: 1px solid var(--line); background: white; }
        .crumbs { gap: 11px; color: var(--muted); font-size: 13px; }
        .crumbs i { font-style: normal; color: #a6afbd; }
        .crumbs strong { font-weight: 600; color: var(--ink); }
        .account { gap: 9px; color: var(--muted); font-size: 14px; }
        .avatar, .lock-tile { display: grid; place-items: center; border-radius: 50%; background: #ebedff; color: var(--accent); }
        .avatar { width: 30px; height: 30px; }
        .avatar .icon { width: 16px; height: 16px; }
        main { max-width: 784px; padding: clamp(26px, 5vw, 64px) 22px 40px; margin: 0 auto; }
        .heading { gap: 16px; margin-bottom: 24px; }
        .lock-tile { width: 52px; height: 52px; flex: none; border: 1px solid #dadff9; border-radius: 14px; }
        .lock-tile .icon { width: 25px; height: 25px; }
        h1 { font-size: clamp(24px, 3.2vw, 32px); line-height: 1.3; letter-spacing: -.035em; }
        .heading p { margin-top: 4px; font-size: 14px; color: var(--muted); }
        .card { background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 3px 15px rgb(34 49 81 / 4%); }
        .fields { padding: clamp(20px, 4vw, 34px); }
        .field + .field { margin-top: 22px; }
        .field:first-child { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #e9edf3; }
        label { display: inline-block; margin-bottom: 8px; font-size: 14px; font-weight: 640; }
        .input-wrap { overflow: hidden; min-height: 44px; border: 1px solid #c9d2e0; border-radius: 7px; background: white; }
        .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px #eceefe; }
        .input-wrap.invalid { border-color: var(--error); }
        .input-wrap input { min-width: 0; width: 100%; border: 0; padding: 11px 13px; outline: 0; background: transparent; color: var(--ink); }
        .input-wrap input::placeholder { color: #8591a5; font-size: 14px; }
        .eye { display: grid; place-items: center; align-self: stretch; flex: 0 0 44px; border: 0; color: #6e7b91; background: transparent; }
        .eye .icon { width: 18px; height: 18px; }
        .eye:hover { color: var(--accent); background: #f5f6fd; }
        .eye:focus-visible { outline-offset: -4px; }
        .hint, .error { margin-top: 6px; font-size: 13px; }
        .hint { color: var(--muted); }
        .error { color: var(--error); }
        .hint code { background: #f0f2fa; color: #434f6c; padding: 2px 5px; border-radius: 4px; }
        .footer { padding: 17px clamp(20px, 4vw, 34px); border-top: 1px solid var(--line); }
        .buttons { justify-content: flex-end; gap: 10px; }
        .btn { min-height: 39px; border: 1px solid #cdd5e1; border-radius: 6px; padding: 6px 17px; font-size: 14px; background: white; color: var(--ink); }
        .btn:hover:enabled { border-color: var(--accent); color: var(--accent); }
        .btn.primary { background: var(--accent); color: white; font-weight: 600; border-color: var(--accent); }
        .btn.primary:hover:enabled { color: white; background: #444fae; }
        .status:not(:empty) { padding: 10px 14px; margin-bottom: 14px; font-size: 14px; border: 1px solid #b9dfd0; border-radius: 7px; color: #205a46; background: #f0f9f4; }
        .preview-note { margin-top: 12px; text-align: end; font-size: 12px; color: var(--muted); }
        @media (max-width: 767px) {
            .shell { grid-template-columns: 64px minmax(0, 1fr); }
            .brand, .nav-item { justify-content: center; padding: 0; }
            .brand span, .nav-item span, .nav-item .chevron, .username { display: none; }
            aside nav { padding: 14px 7px; }
            .subnav { margin-left: 4px; padding-left: 3px; }
            .topbar { gap: 8px; }
            .crumbs { gap: 6px; }
            main { padding: 24px 12px; }
            .heading { gap: 10px; }
            .lock-tile { width: 40px; height: 40px; border-radius: 10px; }
            .fields { padding: 20px 14px; }
            .footer { padding: 14px; }
        }
        @media (max-width: 400px) {
            .topbar { padding-inline: 10px; }
            .crumbs { font-size: 12px; }
        }
    </style>
</head>

    <div class="shell">
        <aside>
            <div class="brand"><svg class="icon" aria-hidden="true"><use href="#Sunny"/></svg><span>SolarNotes 管理后台</span></div>
            <nav aria-label="后台导航">
                <a class="nav-item" href="body-management-prototype.html" title="天体管理" aria-label="天体管理"><svg class="icon" aria-hidden="true"><use href="#Moon"/></svg><span>天体管理</span></a>
                <a class="nav-item" href="book-management-prototype.html" title="书籍管理" aria-label="书籍管理"><svg class="icon" aria-hidden="true"><use href="#Reading"/></svg><span>书籍管理</span></a>
                <a class="nav-item" href="catalogue-management-prototype.html" title="目录管理" aria-label="目录管理"><svg class="icon" aria-hidden="true"><use href="#Notebook"/></svg><span>目录管理</span></a>
                <button type="button" class="nav-item" id="account-toggle" title="账号管理" aria-label="账号管理" aria-expanded="true" aria-controls="account-items">
                    <svg class="icon" aria-hidden="true"><use href="#User"/></svg><span>账号管理</span><svg class="icon chevron" aria-hidden="true"><use href="#ArrowDown"/></svg>
                </button>
                <div id="account-items" class="subnav">
                    <a class="nav-item" href="#page-title" aria-label="修改密码" title="修改密码" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#Key"/></svg><span>修改密码</span></a>
                </div>
            </nav>
        </aside>
        <div class="workspace">
            <header class="topbar">
                <div class="crumbs" aria-label="当前位置"><span>管理后台</span><i aria-hidden="true">/</i><span>账号管理</span><i aria-hidden="true">/</i><strong>修改密码</strong></div>
                <div class="account"><span class="avatar"><svg class="icon" aria-hidden="true"><use href="#User"/></svg></span><span class="username">admin</span></div>
            </header>
            <main>
                <div class="heading">
                    <span class="lock-tile"><svg class="icon" aria-hidden="true"><use href="#Lock"/></svg></span>
                    <div><h1 id="page-title" tabindex="-1">修改密码</h1><p>为当前账号 admin 设置新的登录密码。</p></div>
                </div>
                <form id="password-form" class="card" novalidate aria-labelledby="page-title">
                    <div class="fields">
                        <div class="field">
                            <label for="current-password">原密码</label>
                            <div class="input-wrap">
                                <input id="current-password" type="password" autocomplete="current-password" spellcheck="false" required placeholder="请输入原密码" aria-describedby="current-hint current-password-error">
                                <button class="eye" type="button" aria-controls="current-password" aria-label="显示原密码" title="显示原密码"><svg class="icon" aria-hidden="true"><use href="#View"/></svg></button>
                            </div>
                            <p class="hint" id="current-hint">初始演示密码为 <code>SolarDemo1</code>。</p>
                            <p class="error" id="current-password-error" aria-live="polite" hidden></p>
                        </div>
                        <div class="field">
                            <label for="new-password">新密码</label>
                            <div class="input-wrap">
                                <input id="new-password" type="password" autocomplete="new-password" spellcheck="false" required placeholder="请输入新密码" aria-describedby="new-hint new-password-error">
                                <button class="eye" type="button" aria-controls="new-password" aria-label="显示新密码" title="显示新密码"><svg class="icon" aria-hidden="true"><use href="#View"/></svg></button>
                            </div>
                            <p class="hint" id="new-hint">使用 6–20 个字符。</p>
                            <p class="error" id="new-password-error" aria-live="polite" hidden></p>
                        </div>
                        <div class="field">
                            <label for="confirm-password">确认新密码</label>
                            <div class="input-wrap">
                                <input id="confirm-password" type="password" autocomplete="new-password" spellcheck="false" required placeholder="请再次输入新密码" aria-describedby="confirm-password-error">
                                <button class="eye" type="button" aria-controls="confirm-password" aria-label="显示确认新密码" title="显示确认新密码"><svg class="icon" aria-hidden="true"><use href="#View"/></svg></button>
                            </div>
                            <p class="error" id="confirm-password-error" aria-live="polite" hidden></p>
                        </div>
                    </div>
                    <div class="footer">
                        <p id="result" class="status" role="status" aria-live="polite"></p>
                        <div class="buttons">
                            <button class="btn" type="reset">清空</button>
                            <button class="btn primary" id="save" type="submit">确认修改</button>
                        </div>
                    </div>
                </form>
                <p class="preview-note">交互原型 · 仅在当前页面模拟修改</p>
            </main>
        </div>
    </div>
    <script>
        const form = document.getElementById('password-form')
        const menu = document.getElementById('account-toggle')
        const save = document.getElementById('save')
        const result = document.getElementById('result')
        const current = document.getElementById('current-password')
        const next = document.getElementById('new-password')
        const confirmation = document.getElementById('confirm-password')
        const fields = [current, next, confirmation]
        const eyes = Array.from(form.querySelectorAll('.eye'))
        let demoPassword = 'SolarDemo1'
        let saving = false

        menu.addEventListener('click', function () {
            const open = menu.getAttribute('aria-expanded') === 'true'
            menu.setAttribute('aria-expanded', String(!open))
            document.getElementById('account-items').hidden = open
        })

        function showError(input, message) {
            const error = document.getElementById(input.id + '-error')
            error.textContent = message
            error.hidden = message === ''
            input.setAttribute('aria-invalid', String(message !== ''))
            input.parentElement.classList.toggle('invalid', message !== '')
        }

        function validationMessage(input) {
            if (input.value.trim() === '') {
                if (input === confirmation) return '请再次输入新密码。'
                return '请输入' + input.labels[0].textContent + '。'
            }
            if (input === next) {
                const length = Array.from(next.value).length
                if (length < 6 || length > 20) return '新密码长度须为 6–20 个字符。'
            }
            if (input === confirmation && confirmation.value !== next.value) return '两次输入的新密码不一致。'
            return ''
        }

        function reveal(button, visible) {
            const input = document.getElementById(button.getAttribute('aria-controls'))
            input.type = visible ? 'text' : 'password'
            const action = (visible ? '隐藏' : '显示') + input.labels[0].textContent
            button.setAttribute('aria-label', action)
            button.title = action
            button.querySelector('use').setAttribute('href', visible ? '#Hide' : '#View')
        }

        for (const eye of eyes) {
            eye.addEventListener('click', function () {
                const input = document.getElementById(eye.getAttribute('aria-controls'))
                reveal(eye, input.type === 'password')
            })
        }

        for (const input of fields) {
            input.addEventListener('input', function () {
                result.textContent = ''
                if (input.getAttribute('aria-invalid') === 'true') showError(input, validationMessage(input))
                if (input === next && confirmation.value !== '') showError(confirmation, validationMessage(confirmation))
            })
            input.addEventListener('blur', function () {
                if (input === current && current.getAttribute('aria-invalid') === 'true') return
                if (input.value !== '') showError(input, validationMessage(input))
            })
        }

        form.addEventListener('reset', function () {
            result.textContent = ''
            for (const input of fields) showError(input, '')
            for (const eye of eyes) reveal(eye, false)
            current.focus()
        })

        form.addEventListener('submit', async function (event) {
            event.preventDefault()
            if (saving) return
            result.textContent = ''
            let firstError = null
            for (const input of fields) {
                const message = validationMessage(input)
                showError(input, message)
                if (firstError === null && message !== '') firstError = input
            }
            if (firstError !== null) {
                firstError.focus()
                return
            }

            saving = true
            form.setAttribute('aria-busy', 'true')
            for (const control of form.elements) control.disabled = true
            save.textContent = '正在修改…'
            await new Promise(function (done) { window.setTimeout(done, 300) })
            const matches = current.value === demoPassword
            if (matches) demoPassword = next.value
            saving = false
            form.removeAttribute('aria-busy')
            for (const control of form.elements) control.disabled = false
            save.textContent = '确认修改'
            if (!matches) {
                showError(current, '原密码不正确，请重新输入。')
                current.focus()
                return
            }
            form.reset()
            document.getElementById('current-hint').textContent = '请使用上次设置的演示密码，刷新页面可还原初始密码。'
            result.textContent = '密码已修改。'
        })
    </script>
</body>
</html>
